name: SaaS Foundation

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    paths:
      - 'api/routers/auth.py'
      - 'api/routers/health.py'
      - 'api/routers/onboarding.py'
      - 'api/routers/platform_meta.py'
      - 'api/security/**'
      - 'apps/web/app/dashboard/**'
      - 'apps/web/app/login/**'
      - 'apps/web/app/signup/**'
      - 'apps/web/lib/runtime-api.ts'
      - 'apps/web/next.config.js'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'core/config/deployment_identity.py'
      - 'core/email/**'
      - 'db/models.py'
      - 'db/models_subscription.py'
      - 'dealix/onboarding/**'
      - 'scripts/verify_saas_foundation.py'
      - 'tests/test_deployment_identity_runtime.py'
      - 'tests/test_saas_*.py'
      - 'docs/ops/SAAS_ACTIVATION_RUNBOOK.md'
      - '.github/workflows/saas-foundation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/routers/auth.py'
      - 'api/routers/health.py'
      - 'api/routers/onboarding.py'
      - 'api/routers/platform_meta.py'
      - 'api/security/**'
      - 'apps/web/app/dashboard/**'
      - 'apps/web/app/login/**'
      - 'apps/web/app/signup/**'
      - 'apps/web/lib/runtime-api.ts'
      - 'apps/web/next.config.js'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'core/config/deployment_identity.py'
      - 'core/email/**'
      - 'db/models.py'
      - 'db/models_subscription.py'
      - 'dealix/onboarding/**'
      - 'scripts/verify_saas_foundation.py'
      - 'tests/test_deployment_identity_runtime.py'
      - 'tests/test_saas_*.py'
      - 'docs/ops/SAAS_ACTIVATION_RUNBOOK.md'
      - '.github/workflows/saas-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify SaaS backend foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile changed Python surfaces
        run: |
          python -m py_compile \
            api/routers/health.py \
            api/routers/onboarding.py \
            api/routers/platform_meta.py \
            api/security/api_key.py \
            core/config/deployment_identity.py \
            core/email/__init__.py \
            core/email/invites.py \
            dealix/onboarding/service.py \
            scripts/verify_saas_foundation.py \
            tests/test_deployment_identity_runtime.py \
            tests/test_saas_onboarding_contract.py \
            tests/test_saas_foundation_verifier.py \
            tests/test_saas_web_journey_contract.py

      - name: Verify repository SaaS contracts
        run: python scripts/verify_saas_foundation.py --json

      - name: Run focused regressions
        run: |
          pytest -q --no-cov \
            tests/test_deployment_identity_runtime.py \
            tests/test_saas_onboarding_contract.py \
            tests/test_saas_foundation_verifier.py \
            tests/test_saas_web_journey_contract.py

  web:
    name: Verify SaaS web journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_DEALIX_API_BASE: https://api.example.invalid
      NEXT_PUBLIC_API_URL: https://api.example.invalid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build
