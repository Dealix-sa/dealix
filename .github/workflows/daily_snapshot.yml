name: Daily Snapshot

# Manual audit-trail utility. The scheduled daily owner is
# governed-full-ops-daily.yml (issue #883).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealix-daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Write daily snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal compatible deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Build snapshot
        id: build
        run: |
          set -e
          mkdir -p docs/snapshots
          python3 scripts/dealix_snapshot.py
          DATE="$(date -u +%Y-%m-%d)"
          FILE="docs/snapshots/${DATE}.json"
          if [ ! -f "$FILE" ]; then
            echo "❌ snapshot file missing: $FILE"
            echo "    scripts/dealix_snapshot.py exited cleanly but produced no output."
            exit 1
          fi
          echo "snapshot_path=$FILE" >> "$GITHUB_OUTPUT"
          echo "snapshot_date=$DATE" >> "$GITHUB_OUTPUT"
          echo "✅ snapshot written: $FILE ($(wc -c < "$FILE") bytes)"

      - name: Upload snapshot as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: dealix-daily-snapshot-${{ steps.build.outputs.snapshot_date }}
          path: ${{ steps.build.outputs.snapshot_path }}
          retention-days: 90
          if-no-files-found: error
