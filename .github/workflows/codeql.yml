name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"  # Mondays 02:00 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          # Shared with security.yml. This job previously inlined its own query
          # set and ignored the config file, so the two CodeQL scans that run on
          # every PR applied different rules and different path exclusions, and
          # reported the same findings twice under different check names.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
