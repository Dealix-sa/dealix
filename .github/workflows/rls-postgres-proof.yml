name: PostgreSQL RLS Binding Proof

on:
  pull_request:
    paths:
      - "db/tenant_session.py"
      - "db/rls_policies.py"
      - "tests/test_tenant_session_binding.py"
      - ".github/workflows/rls-postgres-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rls-postgres-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-tenant-binding:
    name: PostgreSQL tenant binding (no skips)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealix_test
          POSTGRES_PASSWORD: dealix_test
          POSTGRES_DB: dealix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealix_test -d dealix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://dealix_test:dealix_test@127.0.0.1:5432/dealix_test
      TEST_POSTGRES_URL: postgresql+asyncpg://dealix_test:dealix_test@127.0.0.1:5432/dealix_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install repository test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: >-
          ruff check
          db/tenant_session.py
          db/rls_policies.py
          tests/test_tenant_session_binding.py

      - name: PostgreSQL semantic tests
        shell: bash
        run: |
          set -euo pipefail
          output="$(python -m pytest -q --no-cov tests/test_tenant_session_binding.py -rs)"
          printf '%s\n' "$output"
          if grep -Eq '[0-9]+ skipped' <<<"$output"; then
            echo "PostgreSQL proof is incomplete: skipped tests detected."
            exit 1
          fi
